[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-emotion-recognition"
version = "1.0.0"
description = "Real-time emotion recognition from facial expressions, tone of voice and speech."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yash Bhardwaj" }]
requires-python = ">=3.9"
dependencies = [
    "deepface>=0.0.89",
    "mtcnn>=0.1.1",
    "numpy",
    "openai-whisper>=20231117",
    "opencv-python>=4.8",
    "sounddevice>=0.4.6",
    "tf-keras",  # required by DeepFace on TensorFlow >= 2.16
    "torch>=2.0",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
emotion-recognition = "emotion_analyzer.cli:main"

[project.urls]
Repository = "https://github.com/sudo-YashBhardwaj/Multimodal-Emotion-Recogniton"

[tool.setuptools]
packages = ["emotion_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
